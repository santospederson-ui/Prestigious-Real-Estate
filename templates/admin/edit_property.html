<style>

/* =================================
   EDIT PROPERTY ADMIN PAGE
================================= */


.admin-form-section{

    padding:70px 0;
    background:#f7f8fa;

}



.admin-form-card{

    background:white;
    padding:45px;
    border-radius:18px;
    box-shadow:0 15px 40px rgba(0,0,0,.08);

}



/* HEADER */


.form-header{

    text-align:center;
    margin-bottom:40px;

}



.form-header h1{

    font-family:'Playfair Display',serif;
    color:#1F2A44;
    font-size:42px;
    font-weight:800;
    margin-bottom:10px;

}



.form-header p{

    color:#777;
    font-size:15px;

}





/* FORM GRID */


.form-grid{

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;

}




/* LABELS */


.admin-form-card label{

    display:block;
    color:#1F2A44;
    font-weight:700;
    font-size:14px;
    margin-bottom:8px;

}





/* INPUTS */


.admin-form-card input,
.admin-form-card select,
.admin-form-card textarea{


    width:100%;
    padding:14px 15px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:14px;
    font-family:'Inter',sans-serif;
    color:#212529;
    background:white;
    transition:.3s;


}



.admin-form-card input:focus,
.admin-form-card select:focus,
.admin-form-card textarea:focus{


    outline:none;
    border-color:#8A1538;
    box-shadow:0 0 0 3px rgba(138,21,56,.12);


}





/* TEXTAREA */


.admin-form-card textarea{


    min-height:130px;
    resize:vertical;
    margin-bottom:25px;

}





/* CHECKBOX FEATURES */


.form-grid input[type="checkbox"]{


    width:auto;
    margin-right:8px;

}




.form-grid div:has(input[type="checkbox"]) label{


    background:#f7f8fa;
    padding:14px;
    border-radius:10px;
    cursor:pointer;
    transition:.3s;

}



.form-grid div:has(input[type="checkbox"]) label:hover{


    background:#eee;

}






/* CURRENT IMAGE */


.current-image{


    margin:35px 0;

}



.current-image label{


    margin-bottom:15px;

}



.current-image img{


    display:block;
    width:250px;
    height:180px;
    object-fit:cover;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);

}







/* BUTTON */


.save-property-btn{


    width:100%;
    padding:16px;
    background:#8A1538;
    color:white;
    border:none;
    border-radius:30px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:.3s;

}



.save-property-btn:hover{


    background:#1F2A44;
    transform:translateY(-3px);


}





/* MOBILE */


@media(max-width:768px){


.admin-form-card{

    padding:25px 20px;

}



.form-header h1{

    font-size:30px;

}



.form-grid{

    grid-template-columns:1fr;

}



.current-image img{

    width:100%;
    height:auto;

}



}



@media(max-width:480px){


.form-header h1{

    font-size:24px;

}


.admin-form-card textarea{

    min-height:100px;

}


}


</style>
