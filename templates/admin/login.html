<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Admin Login | Prestigious Real Estate
</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">


<style>

:root{
  --primary: #8A1538;
  --secondary: #1F2A44;
  --gold: #D4AF37;
  --text-dark: #0f172a;
  --text-muted: #64748b;
  --border-color: #e2e8f0;
}


*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}


body{
  font-family:'Inter', sans-serif;
  background-color: var(--secondary);
  color: var(--text-dark);
  -webkit-font-smoothing: antialiased;
}


/* LOGIN BACKGROUND */

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background: linear-gradient(180deg, rgba(31, 42, 68, 0.65) 0%, rgba(15, 23, 42, 0.90) 100%),
              url("{{ url_for('static', filename='images/contact/contact.jpg') }}");
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  padding:24px;
  position: relative;
}

.login-page::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
  pointer-events: none;
}


/* LOGIN CARD */

.login-card{
  position: relative;
  width: 100%;
  max-width: 440px;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  padding: 50px 40px;
  border-radius: 24px;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35),
              0 0 0 1px rgba(252, 211, 77, 0.3);
  text-align: center;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.login-card:hover {
  box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.45),
              0 0 0 1px rgba(212, 175, 55, 0.5);
}


.login-logo {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 20px;
}

.login-logo img{
  width: 90px;
  height: auto;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.1));
}


.login-card h1{
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  font-weight: 800;
  color: var(--secondary);
  letter-spacing: -0.3px;
  line-height: 1.2;
}

.login-card h1 span{
  color: var(--primary);
}


.login-card p{
  color: var(--text-muted);
  margin: 8px 0 32px;
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}


.login-card label{
  display: block;
  text-align: left;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--secondary);
  letter-spacing: 0.2px;
}


.login-card input{
  width: 100%;
  padding: 15px 18px;
  border: 1.5px solid var(--border-color);
  border-radius: 12px;
  margin-bottom: 22px;
  font-size: 15px;
  font-family: 'Inter', sans-serif;
  color: var(--secondary);
  background-color: #f8fafc;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.login-card input::placeholder {
  color: #94a3b8;
  font-weight: 400;
}

.login-card input:focus{
  outline: none;
  background-color: #ffffff;
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(138, 21, 56, 0.12),
              0 4px 12px rgba(138, 21, 56, 0.08);
}


.login-btn{
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(135deg, var(--primary) 0%, #630e27 100%);
  color: white;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 10px 20px rgba(138, 21, 56, 0.3);
  margin-top: 6px;
}

.login-btn:hover{
  background: linear-gradient(135deg, var(--secondary) 0%, #0f172a 100%);
  transform: translateY(-2px);
  box-shadow: 0 14px 26px rgba(31, 42, 68, 0.35);
}

.login-btn:active {
  transform: translateY(0);
}


@media(max-width: 480px){

  .login-page {
    padding: 16px;
  }

  .login-card{
    padding: 36px 24px;
    border-radius: 20px;
  }

  .login-card h1{
    font-size: 24px;
  }

  .login-logo img {
    width: 75px;
  }

}

</style>


</head>


<body>


<section class="login-page">


<div class="login-card">


<div class="login-logo">

<img src="{{ url_for('static', filename='images/logo.png') }}">

</div>



<h1>
Prestigious Real <span>Estate</span>
</h1>


<p>
Admin Login
</p>



<form method="POST">


<label>
Username
</label>


<input
type="text"
name="username"
placeholder="Enter username"
required>




<label>
Password
</label>


<input
type="password"
name="password"
placeholder="Enter password"
required>



<button class="login-btn">

Login

</button>


</form>


</div>


</section>


</body>

</html>
