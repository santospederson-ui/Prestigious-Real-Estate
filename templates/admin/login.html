<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Admin Login | Prestigious Real Estate
</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">


<style>

:root{

--primary:#8A1538;
--secondary:#1F2A44;
--gold:#D4AF37;

}


*{

margin:0;
padding:0;
box-sizing:border-box;

}


body{

font-family:'Inter',sans-serif;

}


/* LOGIN BACKGROUND */

.login-page{

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

background: rgba(0,0,0,0.25)

url("{{ url_for('static', filename='images/contact/contact.jpg') }}");


background-size:cover;

background-position:center;

padding:20px;

}



/* LOGIN CARD */

.login-card{

width:420px;

background:white;

padding:45px;

border-radius:20px;

box-shadow:0 20px 60px rgba(0,0,0,.25);

text-align:center;

}




.login-logo img{

width:100px;

}




.login-card h1{

margin-top:20px;

font-family:'Playfair Display',serif;

font-size:32px;

color:var(--secondary);

}



.login-card h1 span{

color:var(--primary);

}




.login-card p{

color:#777;

margin:10px 0 30px;

font-weight:600;

}




.login-card label{

display:block;

text-align:left;

font-size:14px;

font-weight:600;

margin-bottom:8px;

color:var(--secondary);

}



.login-card input{

width:100%;

padding:14px;

border:1px solid #ddd;

border-radius:8px;

margin-bottom:18px;

font-size:15px;

}




.login-card input:focus{

outline:none;

border-color:var(--primary);

box-shadow:0 0 0 3px rgba(138,21,56,.15);

}




.login-btn{

width:100%;

padding:14px;

border:none;

border-radius:25px;

background:var(--primary);

color:white;

font-size:16px;

font-weight:700;

cursor:pointer;

transition:.3s;

}



.login-btn:hover{

background:var(--secondary);

}



@media(max-width:500px){


.login-card{

width:100%;

padding:30px 25px;

}


.login-card h1{

font-size:26px;

}


}


</style>


</head>


<body>


<section class="login-page">


<div class="login-card">


<div class="login-logo">

<img src="{{ url_for('static', filename='images/logo.png') }}">

</div>



<h1>
Prestigious Real <span>Estate</span>
</h1>


<p>
Admin Login
</p>



<form method="POST">


<label>
Username
</label>


<input
type="text"
name="username"
placeholder="Enter username"
required>




<label>
Password
</label>


<input
type="password"
name="password"
placeholder="Enter password"
required>



<button class="login-btn">

Login

</button>


</form>


</div>


</section>


</body>

</html>
