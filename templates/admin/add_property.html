{% extends "base.html" %}


{% block title %}

Add Property | Prestigious Real Estate Admin

{% endblock %}




{% block content %}



<section class="admin-form-section">


<div class="container">


<div class="admin-form-card">



<div class="form-header">

<h1>
Add New Property
</h1>


<p>
Create a premium property listing for Qatar market
</p>

</div>







<form method="POST"
enctype="multipart/form-data">





<div class="form-grid">





<div>

<label>
Property Title
</label>

<input
type="text"
name="title"
placeholder="Luxury Villa in Lusail"
required>

</div>







<div>

<label>
Purpose
</label>


<select name="purpose" required>


<option value="">
Select Purpose
</option>


<option value="Sale">
For Sale
</option>


<option value="Rent">
For Rent
</option>


</select>


</div>







<div>

<label>
Property Type
</label>


<select name="property_type" required>


<option>
Villa
</option>


<option>
Apartment
</option>


<option>
Office
</option>


<option>
Commercial Building
</option>


</select>


</div>







<div>

<label>
Location
</label>


<select name="location">


<option>
Doha
</option>

<option>
Lusail
</option>

<option>
The Pearl
</option>

<option>
West Bay
</option>

<option>
Al Wakrah
</option>


</select>


</div>






<div>

<label>
Price (QAR)
</label>


<input
type="number"
name="price"
placeholder="3500000">


</div>






<div>

<label>
Bedrooms
</label>


<input
type="number"
name="bedrooms"
placeholder="0"
required>


</div>






<div>

<label>
Bathrooms
</label>


<input
type="number"
name="bathrooms"
placeholder="0"
required>


</div>







<div>

<label>
Area SQM
</label>


<input
type="number"
name="area"
placeholder="700">


</div>







<div>

<label>
Parking Spaces
</label>


<input
type="number"
name="parking"
placeholder="0"
required>


</div>








<div>

<label>
Furnished
</label>


<select name="furnished">


<option value="Not Furnished">
Not Furnished
</option>


<option value="Semi Furnished">
Semi Furnished
</option>


<option value="Fully Furnished">
Fully Furnished
</option>


</select>


</div>




</div>









<label>

Property Address

</label>


<textarea
name="address"
placeholder="Complete property address">
</textarea>








<label>

Property Description

</label>


<textarea
name="description"
placeholder="Describe property features, location advantages and facilities">
</textarea>









<label>

Upload Property Images

</label>



<p style="color:#777;margin-bottom:10px;">

First image will automatically become the main property image.

</p>




<input

type="file"

name="images"

multiple

accept="image/*"

required

>











    <!-- =========================
     PROPERTY FEATURES
========================= -->


<label>
Property Features
</label>


<div class="features-grid">


<label>
<input type="checkbox"
name="features"
value="Swimming Pool">

Swimming Pool

</label>



<label>
<input type="checkbox"
name="features"
value="Smart Home">

Smart Home

</label>



<label>
<input type="checkbox"
name="features"
value="Sea View">

Sea View

</label>



<label>
<input type="checkbox"
name="features"
value="Private Garden">

Private Garden

</label>



<label>
<input type="checkbox"
name="features"
value="Gym">

Gym

</label>



<label>
<input type="checkbox"
name="features"
value="Security 24/7">

Security 24/7

</label>



<label>
<input type="checkbox"
name="features"
value="Maid Room">

Maid Room

</label>



<label>
<input type="checkbox"
name="features"
value="Balcony">

Balcony

</label>


</div>





<button

type="submit"

class="save-property-btn">

Save Property

</button>







</form>







</div>


</div>


</section>


<style>

/* ==========================
   ADD PROPERTY PAGE STYLE
========================== */

.admin-form-section{

    padding:70px 0;
    background:#f7f8fa;

}


.admin-form-card{

    background:white;
    max-width:1000px;
    margin:auto;
    padding:45px;
    border-radius:18px;
    box-shadow:0 15px 40px rgba(0,0,0,.08);

}


/* HEADER */

.form-header{

    text-align:center;
    margin-bottom:40px;

}


.form-header h1{

    font-family:'Playfair Display',serif;
    color:#1F2A44;
    font-size:40px;
    font-weight:800;
    margin-bottom:10px;

}


.form-header p{

    color:#777;
    font-size:15px;

}



/* GRID */

.form-grid{

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;

}



/* LABELS */

.admin-form-card label{

    display:block;
    margin-bottom:8px;
    color:#1F2A44;
    font-size:14px;
    font-weight:700;

}




/* INPUTS */


.admin-form-card input,
.admin-form-card select,
.admin-form-card textarea{


    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:14px;
    font-family:'Inter',sans-serif;
    background:white;

}



.admin-form-card input:focus,
.admin-form-card select:focus,
.admin-form-card textarea:focus{

    outline:none;
    border-color:#8A1538;
    box-shadow:0 0 0 3px rgba(138,21,56,.15);

}



.admin-form-card textarea{

    min-height:130px;
    margin-bottom:25px;
    resize:vertical;

}



/* FILE UPLOAD */

.admin-form-card input[type="file"]{

    background:#f8f8f8;
    padding:12px;

}



/* FEATURES */

.features-grid{

    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    background:#f7f8fa;
    padding:25px;
    border-radius:12px;
    margin:20px 0 35px;

}



.features-grid label{

    background:white;
    padding:12px;
    border-radius:8px;
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,.05);

}



.features-grid input{

    width:auto;

}




/* BUTTON */

.save-property-btn{

    width:100%;
    padding:16px;
    background:#8A1538;
    color:white;
    border:none;
    border-radius:30px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:.3s;

}


.save-property-btn:hover{

    background:#1F2A44;

}




/* MOBILE */

@media(max-width:768px){


.admin-form-card{

    padding:25px 20px;

}


.form-grid{

    grid-template-columns:1fr;

}


.form-header h1{

    font-size:30px;

}



.features-grid{

    grid-template-columns:1fr 1fr;

}


}



@media(max-width:480px){


.form-header h1{

    font-size:24px;

}


.features-grid{

    grid-template-columns:1fr;

}


}

</style>


{% endblock %}
