<!-- =========================
LIGHTBOX MODAL FOR FULL VIEW
========================= -->

<div id="imageLightbox" class="lightbox-modal">
  <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
  
  <!-- NEXT / PREVIOUS PAGINATION BUTTONS -->
  <button class="lightbox-nav prev" onclick="changeLightboxImage(-1)">&#10094;</button>
  <img class="lightbox-content" id="lightboxImg" alt="Full Property Image">
  <button class="lightbox-nav next" onclick="changeLightboxImage(1)">&#10095;</button>

  <!-- IMAGE COUNTER BADGE -->
  <div id="lightboxCounter" class="lightbox-counter">1 / 1</div>
</div>

<script>
  // Dynamic array of full image URLs
  const galleryImageUrls = [
    {% if gallery_images %}
      {% for img in gallery_images %}
        "{{ img.image_name }}",
      {% endfor %}
    {% elif property.main_image %}
      "{{ property.main_image }}"
    {% endif %}
  ];

  let currentImageIndex = 0;

  function openLightbox(index) {
    if (galleryImageUrls.length === 0) return;
    currentImageIndex = index;
    updateLightbox();
    
    const modal = document.getElementById("imageLightbox");
    modal.style.display = "flex";
  }

  function closeLightbox() {
    const modal = document.getElementById("imageLightbox");
    if (modal) {
      modal.style.display = "none";
    }
  }

  function changeLightboxImage(direction) {
    if (galleryImageUrls.length === 0) return;
    currentImageIndex = (currentImageIndex + direction + galleryImageUrls.length) % galleryImageUrls.length;
    updateLightbox();
  }

  function updateLightbox() {
    const modalImg = document.getElementById("lightboxImg");
    const counter = document.getElementById("lightboxCounter");
    
    modalImg.src = galleryImageUrls[currentImageIndex];
    counter.innerText = `${currentImageIndex + 1} / ${galleryImageUrls.length}`;
  }

  // Click outside image to close
  window.onclick = function(event) {
    const modal = document.getElementById("imageLightbox");
    if (event.target === modal) {
      closeLightbox();
    }
  };

  // Keyboard navigation (Escape to close, Left/Right arrows to paginate)
  document.addEventListener('keydown', function(event) {
    const modal = document.getElementById("imageLightbox");
    if (modal.style.display === "flex") {
      if (event.key === "Escape") closeLightbox();
      if (event.key === "ArrowLeft") changeLightboxImage(-1);
      if (event.key === "ArrowRight") changeLightboxImage(1);
    }
  });
</script>
